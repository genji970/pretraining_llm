[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "from-scratch-training"
version = "0.1.0"
description = "Extensible from-scratch decoder-only language-model pretraining project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
]

[project.optional-dependencies]
huggingface = ["datasets>=2.19"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["training*"]

[tool.ruff]
line-length = 100
